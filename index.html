<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>Andover Searchables</title>
  <style>
    :root {
      --paper: #f4f2ec;
      --paper-deep: #e9e6dd;
      --ink: #202521;
      --muted: #737970;
      --line: rgba(32, 37, 33, .12);
      --green: #1f5c45;
      --green-soft: #dfe9e2;
      --white: rgba(255, 255, 255, .72);
      --shadow: 0 24px 70px rgba(36, 42, 37, .09);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--paper);
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overscroll-behavior: none;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% -5%, rgba(255, 255, 255, .95), transparent 31rem),
        linear-gradient(145deg, var(--paper) 0%, #f7f5f0 52%, #eeece5 100%);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: .01em;
    }

    button, input { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    .shell {
      width: min(980px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 72px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -.025em;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      color: #f5f2e9;
      background: var(--green);
      font-size: 16px;
      font-style: italic;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16);
    }

    .actions { display: flex; align-items: center; gap: 10px; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 255, 255, .45);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .button:hover { transform: translateY(-1px); background: rgba(255, 255, 255, .8); }
    .button:active { transform: translateY(0); }
    .button.primary { color: white; border-color: var(--green); background: var(--green); }
    .button.primary:hover { background: #184c39; }
    .button svg { width: 16px; height: 16px; }

    .hero { padding: 34px 0 26px; }

    .search-wrap {
      position: relative;
      margin-top: 0;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 24px;
      width: 22px;
      height: 22px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 76px;
      padding: 0 64px 0 62px;
      border: 1px solid rgba(32, 37, 33, .14);
      border-radius: 22px;
      outline: 0;
      color: var(--ink);
      background: rgba(255, 255, 255, .76);
      box-shadow: var(--shadow);
      font-size: 22px;
      caret-color: var(--green);
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    #search::placeholder { color: #9ca098; }
    #search::-webkit-search-cancel-button,
    #search::-webkit-search-decoration {
      display: none;
      -webkit-appearance: none;
      appearance: none;
    }
    #search:focus {
      border-color: rgba(31, 92, 69, .45);
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 24px 74px rgba(36, 42, 37, .12), 0 0 0 4px rgba(31, 92, 69, .07);
    }

    .clear-search {
      position: absolute;
      top: 50%;
      right: 20px;
      display: none;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transform: translateY(-50%);
    }

    .clear-search:hover { color: var(--ink); background: var(--paper-deep); }
    .clear-search.visible { display: grid; place-items: center; }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 48px;
      padding: 12px 4px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .dictionary-status { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #a8aba4; }
    .status-dot.ready { background: #3b8968; box-shadow: 0 0 0 4px rgba(59, 137, 104, .10); }

    .text-button {
      padding: 5px 0;
      border: 0;
      color: var(--muted);
      background: none;
      font-size: 12px;
      cursor: pointer;
    }
    .text-button:hover { color: #9c3e35; }

    #results { display: grid; gap: 14px; padding-top: 14px; }

    .result-card {
      padding: 27px 30px 28px;
      border: 1px solid rgba(32, 37, 33, .11);
      border-radius: 20px;
      background: var(--white);
      box-shadow: 0 12px 32px rgba(36, 42, 37, .045);
      animation: rise .32s both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .word-title {
      margin: 0 0 20px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -.025em;
    }

    .entry-lines { display: grid; gap: 11px; }

    .entry-line {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 12px;
      font-size: 15px;
      line-height: 1.7;
    }

    .line-label {
      color: var(--green);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .05em;
      padding-top: 4px;
    }

    .line-content { color: #3c423d; overflow-wrap: anywhere; }
    .line-content.example { color: #656b65; font-family: Georgia, "Times New Roman", "Songti SC", serif; font-size: 16px; }

    .plain-line { color: #4f554f; font-size: 15px; line-height: 1.7; }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 220px;
      padding: 36px;
      border: 1px dashed rgba(32, 37, 33, .18);
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 255, 255, .28);
    }

    .empty-state svg { width: 28px; height: 28px; margin-bottom: 14px; color: var(--green); }
    .empty-state strong { display: block; margin-bottom: 7px; color: var(--ink); font-size: 16px; }
    .empty-state p { margin: 0; line-height: 1.6; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(31, 36, 32, .42);
      backdrop-filter: blur(8px);
    }
    .modal-backdrop.visible { display: grid; }

    .modal {
      width: min(720px, 100%);
      padding: 26px;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 24px;
      background: #f8f7f3;
      box-shadow: 0 30px 90px rgba(20, 25, 21, .24);
      animation: modal-in .2s both;
    }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(10px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .modal-title {
      margin: 0 0 6px;
      font-family: Georgia, "Times New Roman", "Songti SC", serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .modal-description { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }

    .modal-close {
      flex: 0 0 auto;
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: var(--paper-deep);
      cursor: pointer;
      font-size: 21px;
    }
    .modal-close:hover { color: var(--ink); }

    #dictionaryInput {
      display: block;
      width: 100%;
      height: min(46vh, 380px);
      min-height: 230px;
      resize: vertical;
      padding: 18px;
      border: 1px solid rgba(32, 37, 33, .15);
      border-radius: 15px;
      outline: 0;
      color: var(--ink);
      background: white;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.65;
      caret-color: var(--green);
    }
    #dictionaryInput:focus { border-color: rgba(31, 92, 69, .55); box-shadow: 0 0 0 4px rgba(31, 92, 69, .07); }
    #dictionaryInput::placeholder { color: #a5aaa3; }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 18px;
    }

    .parse-status { color: var(--muted); font-size: 13px; }
    .parse-status.ready { color: var(--green); font-weight: 650; }
    #loadDictionary:disabled { opacity: .42; cursor: not-allowed; transform: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 30;
      max-width: calc(100% - 32px);
      padding: 12px 18px;
      border-radius: 999px;
      color: white;
      background: #29312c;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .18);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 14px);
      transition: opacity .22s ease, transform .22s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 640px) {
      .shell { width: min(100% - 24px, 980px); padding-top: 18px; }
      .button span { display: none; }
      .button { width: 42px; padding: 0; }
      .hero { padding: 28px 0 22px; }
      #search { height: 68px; padding-left: 54px; font-size: 18px; }
      .search-icon { left: 20px; }
      .result-card { padding: 23px 20px 24px; }
      .entry-line { grid-template-columns: 1fr; gap: 1px; }
      .line-label { padding-top: 0; }
      .modal { padding: 20px; border-radius: 20px; }
      .modal-footer { align-items: stretch; flex-direction: column; }
      #loadDictionary { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="brand-mark">A</span><span>Andover Searchables</span></div>
      <div class="actions">
        <button class="button primary" id="importButton" type="button" title="导入词表">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 16V3m0 0L7 8m5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
          <span>导入词表</span>
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m16.5 16.5 4 4"/></svg>
        <input id="search" type="search" placeholder="输入英文单词或短语…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="搜索词汇">
        <button class="clear-search" id="clearSearch" type="button" aria-label="清空搜索">×</button>
      </div>

      <div class="meta-row">
        <div class="dictionary-status"><span class="status-dot" id="statusDot"></span><span id="statusText">尚未导入词表</span></div>
        <button class="text-button" id="clearDictionary" type="button" hidden>移除词表</button>
      </div>
    </section>

    <section id="results" aria-live="polite"></section>
  </main>

  <div class="modal-backdrop" id="dictionaryModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2 class="modal-title" id="modalTitle">导入词表</h2>
          <p class="modal-description">把词表粘贴到下面，支持“释义/英文解释”和“单词 词性 英文释义 中文释义”格式。新词会追加到现有词表，同名词条自动跳过。</p>
        </div>
        <button class="modal-close" id="closeModal" type="button" aria-label="关闭">×</button>
      </div>
      <textarea id="dictionaryInput" placeholder="在这里粘贴词表…&#10;&#10;例如：&#10;acritical&#9;释义：adj. 不危急的&lt;br/&gt; 英文解释：not critical&lt;br/&gt;; *2;&#10;&#10;或：&#10;collaborator n. partner 合作者; *0;"></textarea>
      <div class="modal-footer">
        <span class="parse-status" id="parseStatus">等待粘贴词表</span>
        <button class="button primary" id="loadDictionary" type="button" disabled>加载词表</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'wordline.dictionary.v1';
      const elements = {
        importButton: document.querySelector('#importButton'),
        search: document.querySelector('#search'),
        clearSearch: document.querySelector('#clearSearch'),
        statusDot: document.querySelector('#statusDot'),
        statusText: document.querySelector('#statusText'),
        clearDictionary: document.querySelector('#clearDictionary'),
        results: document.querySelector('#results'),
        dictionaryModal: document.querySelector('#dictionaryModal'),
        closeModal: document.querySelector('#closeModal'),
        dictionaryInput: document.querySelector('#dictionaryInput'),
        parseStatus: document.querySelector('#parseStatus'),
        loadDictionary: document.querySelector('#loadDictionary'),
        toast: document.querySelector('#toast')
      };

      let entries = [];
      let toastTimer;
      let pendingEntries = [];
      let pendingNewEntries = [];

      function htmlFragmentToText(fragment) {
        const doc = new DOMParser().parseFromString('<body>' + fragment + '</body>', 'text/html');
        doc.querySelectorAll('script, style, iframe, object, embed, link, meta').forEach(node => node.remove());
        doc.querySelectorAll('[style]').forEach(node => {
          if (/visibility\s*:\s*hidden|display\s*:\s*none/i.test(node.getAttribute('style') || '')) node.remove();
        });
        doc.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
        return (doc.body.textContent || '')
          .replace(/\u00a0/g, ' ')
          .replace(/[ \t]+\n/g, '\n')
          .replace(/\n[ \t]+/g, '\n')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
      }

      function parseDictionary(raw) {
        const source = String(raw || '').replace(/^\uFEFF/, '');
        return source
          .split(/;\s*\*(?:0|2)\s*;/i)
          .map(block => block.trim())
          .filter(Boolean)
          .map((block, index) => {
            const tabIndex = block.search(/\t/);
            let term = '';
            let definition = '';

            if (tabIndex >= 0) {
              term = block.slice(0, tabIndex).trim();
              definition = block.slice(tabIndex + 1).trim();
            } else {
              const marker = block.search(/(?:[①②③④⑤⑥⑦⑧⑨]?\s*)释义[：:]/);
              if (marker > 0) {
                term = block.slice(0, marker).trim();
                definition = block.slice(marker).trim();
              }
            }

            if (!term) {
              const line = htmlFragmentToText(block).replace(/\s+/g, ' ').trim();
              const chineseIndex = line.search(/[\u3400-\u9fff]/);
              if (chineseIndex > 0) {
                const head = line.slice(0, chineseIndex).trim();
                const chinese = line.slice(chineseIndex).trim();
                const partOfSpeech = head.match(/^(.+?)\s+(n|v|adj|adv|prep|pron|conj|det|interj|num|aux)\.\s+(.+)$/i);

                if (partOfSpeech) {
                  term = partOfSpeech[1].trim();
                  definition = `释义：${partOfSpeech[2].toLowerCase()}. ${chinese}\n英文解释：${partOfSpeech[3].trim()}`;
                } else {
                  // Entries without a part of speech commonly use a phrase ending
                  // in a preposition, for example: "destitute of lacking 缺乏…".
                  const phrase = head.match(/^(.+?\b(?:of|to|for|with|on|in|at|from|up|down|out|off|over|away|back|through|about|after|against|around|into|without))\s+(.+)$/i);
                  const fallback = head.match(/^(\S+)\s+(.+)$/);
                  const parts = phrase || fallback;
                  if (parts) {
                    term = parts[1].trim();
                    definition = `释义：${chinese}\n英文解释：${parts[2].trim()}`;
                  }
                }
              }
            }

            term = htmlFragmentToText(term).replace(/\s+/g, ' ').trim();
            const text = htmlFragmentToText(definition);
            if (!term || !text) return null;
            return { id: index, term, text, search: term.toLocaleLowerCase('en-US') };
          })
          .filter(Boolean);
      }

      function saveDictionary() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(entries.map(({ term, text }) => ({ term, text }))));
          return true;
        } catch (_) {
          showToast('词表已加载，但文件较大，浏览器无法长期保存');
          return false;
        }
      }

      function restoreDictionary() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          if (!Array.isArray(saved)) return;
          entries = saved
            .filter(item => item && typeof item.term === 'string' && typeof item.text === 'string')
            .map((item, index) => ({ id: index, term: item.term, text: item.text, search: item.term.toLocaleLowerCase('en-US') }));
        } catch (_) {
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      function updateStatus() {
        const ready = entries.length > 0;
        elements.statusDot.classList.toggle('ready', ready);
        elements.statusText.textContent = ready ? `已加载 ${entries.length.toLocaleString('zh-CN')} 个词条` : '尚未导入词表';
        elements.clearDictionary.hidden = !ready;
      }

      function getLineParts(line) {
        const match = line.match(/^([①②③④⑤⑥⑦⑧⑨]?\s*(?:释义|英文解释|例句))[：:]\s*(.*)$/);
        if (!match) return null;
        return { label: match[1].replace(/\s/g, ''), content: match[2], example: /例句/.test(match[1]) };
      }

      function createResultCard(entry, delayIndex) {
        const article = document.createElement('article');
        article.className = 'result-card';
        article.style.animationDelay = `${Math.min(delayIndex * 35, 210)}ms`;

        const title = document.createElement('h2');
        title.className = 'word-title';
        title.textContent = entry.term;
        article.appendChild(title);

        const lines = document.createElement('div');
        lines.className = 'entry-lines';
        entry.text.split(/\n+/).map(item => item.trim()).filter(Boolean).forEach(line => {
          const parts = getLineParts(line);
          if (!parts) {
            const plain = document.createElement('div');
            plain.className = 'plain-line';
            plain.textContent = line;
            lines.appendChild(plain);
            return;
          }
          const row = document.createElement('div');
          row.className = 'entry-line';
          const label = document.createElement('div');
          label.className = 'line-label';
          label.textContent = parts.label;
          const content = document.createElement('div');
          content.className = 'line-content' + (parts.example ? ' example' : '');
          content.textContent = parts.content;
          row.append(label, content);
          lines.appendChild(row);
        });
        article.appendChild(lines);
        return article;
      }

      function renderEmpty(title, message) {
        elements.results.replaceChildren();
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = '<div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></svg><strong></strong><p></p></div>';
        empty.querySelector('strong').textContent = title;
        empty.querySelector('p').textContent = message;
        elements.results.appendChild(empty);
      }

      function renderResults() {
        const query = elements.search.value.trim().toLocaleLowerCase('en-US');
        elements.clearSearch.classList.toggle('visible', Boolean(query));

        if (!entries.length) {
          renderEmpty('先导入你的词表', '点击右上角“导入词表”，然后粘贴完整的词表文本。');
          return;
        }
        const matches = query
          ? entries
              .map(entry => {
                let rank = 3;
                if (entry.search === query) rank = 0;
                else if (entry.search.startsWith(query)) rank = 1;
                else if (entry.search.includes(query)) rank = 2;
                else return null;
                return { entry, rank };
              })
              .filter(Boolean)
              .sort((a, b) => a.rank - b.rank || a.entry.term.length - b.entry.term.length || a.entry.term.localeCompare(b.entry.term))
          : entries.map(entry => ({ entry }));

        elements.results.replaceChildren();
        if (!matches.length) {
          renderEmpty('没有找到这个词', '请检查拼写，或导入包含该词的新词表。');
          return;
        }
        const fragment = document.createDocumentFragment();
        matches.forEach(({ entry }, index) => fragment.appendChild(createResultCard(entry, index)));
        elements.results.appendChild(fragment);
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        elements.toast.textContent = message;
        elements.toast.classList.add('show');
        toastTimer = setTimeout(() => elements.toast.classList.remove('show'), 2800);
      }

      function updateParseStatus() {
        pendingEntries = parseDictionary(elements.dictionaryInput.value);
        const existingTerms = new Set(entries.map(entry => entry.search));
        pendingNewEntries = pendingEntries.filter(entry => {
          if (existingTerms.has(entry.search)) return false;
          existingTerms.add(entry.search);
          return true;
        });
        const hasText = elements.dictionaryInput.value.trim().length > 0;
        const duplicateCount = pendingEntries.length - pendingNewEntries.length;
        elements.parseStatus.classList.toggle('ready', pendingNewEntries.length > 0);
        elements.parseStatus.textContent = pendingEntries.length
          ? pendingNewEntries.length
            ? `将新增 ${pendingNewEntries.length.toLocaleString('zh-CN')} 个词条${duplicateCount ? `，跳过 ${duplicateCount.toLocaleString('zh-CN')} 个重复词条` : ''}`
            : `识别到 ${pendingEntries.length.toLocaleString('zh-CN')} 个词条，但都已存在`
          : hasText ? '暂未识别到词条，请检查格式' : '等待粘贴词表';
        elements.loadDictionary.disabled = !pendingNewEntries.length;
        elements.loadDictionary.textContent = pendingNewEntries.length
          ? `追加 ${pendingNewEntries.length.toLocaleString('zh-CN')} 个词条`
          : '加载词表';
      }

      function openModal() {
        elements.dictionaryModal.classList.add('visible');
        document.body.style.overflow = 'hidden';
        setTimeout(() => elements.dictionaryInput.focus(), 0);
      }

      function closeModal() {
        elements.dictionaryModal.classList.remove('visible');
        document.body.style.overflow = '';
      }

      elements.importButton.addEventListener('click', openModal);
      elements.closeModal.addEventListener('click', closeModal);
      elements.dictionaryModal.addEventListener('click', event => {
        if (event.target === elements.dictionaryModal) closeModal();
      });
      elements.dictionaryInput.addEventListener('input', updateParseStatus);
      elements.loadDictionary.addEventListener('click', () => {
        if (!pendingNewEntries.length) return;
        const addedCount = pendingNewEntries.length;
        entries = entries.concat(pendingNewEntries).map((entry, index) => ({ ...entry, id: index }));
        saveDictionary();
        updateStatus();
        renderResults();
        closeModal();
        elements.dictionaryInput.value = '';
        updateParseStatus();
        elements.search.focus();
        showToast(`已新增 ${addedCount.toLocaleString('zh-CN')} 个词条，共 ${entries.length.toLocaleString('zh-CN')} 个`);
      });
      elements.search.addEventListener('input', renderResults);
      elements.clearSearch.addEventListener('click', () => {
        elements.search.value = '';
        elements.search.focus();
        renderResults();
      });
      elements.clearDictionary.addEventListener('click', () => {
        if (!confirm('确定移除当前词表吗？原始文件不会被删除。')) return;
        entries = [];
        localStorage.removeItem(STORAGE_KEY);
        elements.search.value = '';
        updateStatus();
        renderResults();
        showToast('词表已从浏览器中移除');
      });

      window.addEventListener('keydown', event => {
        if (event.key === 'Escape' && elements.dictionaryModal.classList.contains('visible')) closeModal();
      });

      restoreDictionary();
      updateStatus();
      renderResults();
    })();
  </script>
</body>
</html>
